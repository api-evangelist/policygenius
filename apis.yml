name: Policygenius
description: 'Policygenius is an independent online insurance marketplace and licensed
  brokerage founded in 2014 by Jennifer Fitzgerald and Francois de Lame and headquartered
  in New York City. The platform lets consumers compare quotes, get unbiased expert
  advice, and buy life, disability, homeowners, auto, and renters insurance across
  dozens of carriers, and it operates Policygenius Pro, a turnkey life-insurance fulfillment
  platform for financial advisors, agents, banks, and credit unions. Policygenius
  was acquired by Zinnia (an Eldridge company) in 2023. It was surfaced in the API
  Evangelist network as a portfolio company of Norwest Venture Partners. As of this
  enrichment pass Policygenius publishes no public developer API, developer portal,
  or SDK; its GitHub organization hosts internal tooling and forks only.'
